name: Build SociaSave APK
concurrency:
  group: sociasave-android-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/clipdrop-ui-and-download-flow, feature/sociasave-v1.4-foundation]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-virtualenv \
            autoconf libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev automake autopoint gettext ccache
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" default stable
      - name: Install Buildozer for Python 3.14
        run: |
          python -m pip install --upgrade pip
          pip install "git+https://github.com/kivy/buildozer.git@76bac28545c66bbcc671d49aca553a747d69608e"
          pip install legacy-cgi setuptools cython==0.29.34 virtualenv
      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: sociasave-p4a-develop-${{ hashFiles('buildozer.spec') }}
      - name: Validate cached source archives
        shell: bash
        run: |
          for cache_root in .buildozer "$HOME/.buildozer"; do
            if [ -d "$cache_root" ]; then
              while IFS= read -r -d '' archive; do
                if ! unzip -tq "$archive" >/dev/null 2>&1; then
                  echo "Removing corrupted cached archive: $archive"
                  rm -f "$archive"
                fi
              done < <(find "$cache_root" -type f -path '*/packages/*.zip' -print0)
            fi
          done
      - name: Remove stale p4a temporary environments
        run: |
          if [ -d .buildozer ]; then
            find .buildozer -type d -path '*/build/venv' -prune -exec rm -rf {} +
          fi
      - name: Show build tool versions
        run: |
          python --version
          buildozer --version
          rustc --version
          java -version
      - name: Validate Python syntax
        run: python -m py_compile main.py core.py yt_dlp_plugins/__init__.py yt_dlp_plugins/extractor/__init__.py yt_dlp_plugins/extractor/threads.py pinterest_extractor.py facebook_extractor.py facebook_webview.py tests/test_facebook_extractor.py tests/test_facebook_webview.py
      - name: Install host test dependencies
        run: python -m pip install "yt-dlp==2026.10.26" requests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Test platform routing and archive metadata
        run: |
          python - <<'PY'
          import os
          import tempfile
          import core

          cases = {
              "https://www.instagram.com/p/abc123/": "instagram",
              "https://youtu.be/abc123": "youtube",
              "https://x.com/example/status/123456": "twitter",
              "https://www.facebook.com/watch/?v=123": "facebook",
              "https://fb.watch/abc123/": "facebook",
              "https://www.tiktok.com/@sample/video/123456": "tiktok",
              "https://www.pinterest.com/pin/123456/": "pinterest",
              "https://www.threads.net/@sample/post/123456": "threads",
          }
          for url, expected in cases.items():
              actual = core.detect_platform(url)
              assert actual == expected, (url, expected, actual)

          account = core._account_id({"owner": {"id": "998877", "username": "sample"}})
          assert account == "998877", account
          post = core._post_id({"shortcode": "POST123"}, "https://www.instagram.com/p/POST123/")
          assert post == "POST123", post

          with tempfile.TemporaryDirectory() as temporary:
              folder = os.path.join(temporary, "instagram", account, post)
              core._write_post_text(folder, "Example caption", "https://www.instagram.com/p/POST123/")
              with open(os.path.join(folder, "caption.txt"), encoding="utf-8") as handle:
                  assert handle.read().strip() == "Example caption"
              with open(os.path.join(folder, "source.txt"), encoding="utf-8") as handle:
                  assert "POST123" in handle.read()
          print("SociaSave routing and archive metadata tests passed.")
          PY
      - name: Validate custom Android Java helper
        run: |
          test -f android_src/org/hamedafshari/sociasave/SociaSaveStorage.java
          grep -q "exportDirectory" android_src/org/hamedafshari/sociasave/SociaSaveStorage.java
          grep -q "startFacebookPageCapture" android_src/org/hamedafshari/sociasave/SociaSaveStorage.java
          grep -q "getFacebookPageCaptureHtml" android_src/org/hamedafshari/sociasave/SociaSaveStorage.java
          grep -q "captureFacebookPageMarkup" android_src/org/hamedafshari/sociasave/SociaSaveStorage.java
      - name: Build APK
        run: yes | buildozer -v android debug > build.log 2>&1
      - name: Show error summary (only if build failed)
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -nEi "ImportError:|ERROR:|error:|Exception:|failed|Could not|No such file" build.log | tail -n 100 || true
          echo "===== LAST 80 LINES ====="
          tail -n 80 build.log
          echo "===== JAVA ====="
          java -version 2>&1
      - name: Save full log (only if build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sociasave-build-log
          path: build.log
      - name: Verify Android bridge is packaged in DEX
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "No APK was produced in bin/."
            exit 1
          fi

          unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?\.dex$' > dex-files.txt || true
          if [[ ! -s dex-files.txt ]]; then
            echo "No DEX files were found inside $apk."
            exit 1
          fi

          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -Fq 'org/hamedafshari/sociasave/SociaSaveStorage'; then
              echo "SociaSaveStorage found in $dex"
              exit 0
            fi
          done < dex-files.txt

          echo "SociaSaveStorage class is missing from APK DEX files."
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SociaSave-Android-APK
          path: bin/*.apk
